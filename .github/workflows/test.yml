name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a change on tokenwire's main branch or in the runner image that breaks the
  # action shows up here before the next release does.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  build-tokenwire:
    name: build tokenwire from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rajanaggarwal11/tokenwire
          path: tokenwire
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tokenwire/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          cd tokenwire
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p "$RUNNER_TEMP/out"
          pnpm pack --pack-destination "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tokenwire-tgz
          path: ${{ runner.temp }}/out/*.tgz

  unchanged:
    name: an unchanged scenario passes with a zero diff
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: tw
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
          max-increase: 10%
          comment: false
      - env:
          BASE_INPUT_TOKENS: ${{ steps.tw.outputs.base-input-tokens }}
          INPUT_TOKENS: ${{ steps.tw.outputs.input-tokens }}
          DELTA_TOKENS: ${{ steps.tw.outputs.delta-tokens }}
          CACHE_BREAK: ${{ steps.tw.outputs.cache-break }}
        run: |
          echo "base=$BASE_INPUT_TOKENS head=$INPUT_TOKENS delta=$DELTA_TOKENS"
          [ "$DELTA_TOKENS" = "0" ] || { echo "expected no change"; exit 1; }
          [ "$CACHE_BREAK" = "false" ] || { echo "expected no cache break"; exit 1; }
          [ "$INPUT_TOKENS" -gt 100 ] || { echo "expected a real token count"; exit 1; }

  grows-over-limit:
    name: a new tool over max-increase fails, and says by how much
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: tw
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: VARIANT=tool node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
          max-increase: 10%
          price: "3"
          runs-per-day: "10000"
          comment: false
      - env:
          OUTCOME: ${{ steps.tw.outcome }}
          DELTA_TOKENS: ${{ steps.tw.outputs.delta-tokens }}
          CACHE_BREAK: ${{ steps.tw.outputs.cache-break }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "expected failure, got $OUTCOME"; exit 1; }
          [ "$DELTA_TOKENS" -gt 0 ] || { echo "expected growth"; exit 1; }
          [ "$CACHE_BREAK" = "false" ] || { echo "a new tool is not a cache break within the run"; exit 1; }

  grows-without-limit:
    name: growth without max-increase reports but passes
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: tw
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: VARIANT=tool node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
          comment: false
      - env:
          DELTA_TOKENS: ${{ steps.tw.outputs.delta-tokens }}
        run: '[ "$DELTA_TOKENS" -gt 0 ] || { echo "expected growth"; exit 1; }'

  cache-break:
    name: a timestamp re-rendered per request fails as a cache break
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: tw
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: VARIANT=clock node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
          comment: false
      - env:
          OUTCOME: ${{ steps.tw.outcome }}
          CACHE_BREAK: ${{ steps.tw.outputs.cache-break }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "expected failure, got $OUTCOME"; exit 1; }
          [ "$CACHE_BREAK" = "true" ] || { echo "expected cache-break=true"; exit 1; }
      - id: waived
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: VARIANT=clock node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
          fail-on-cache-break: false
          comment: false
      - env:
          WAIVED_CACHE_BREAK: ${{ steps.waived.outputs.cache-break }}
        run: '[ "$WAIVED_CACHE_BREAK" = "true" ] || exit 1'

  first-run:
    name: with no baseline, writes one and passes
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: tw
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: node test/fixture/scenario.mjs
          snapshot: new-baseline.json
          comment: false
      - env:
          BASELINE_WRITTEN: ${{ steps.tw.outputs.baseline-written }}
        run: |
          [ "$BASELINE_WRITTEN" = "true" ] || exit 1
          node -e 'const s = require("./new-baseline.json"); if (s.tokenwire !== 1 || s.turns.length !== 2) process.exit(1)'
          if grep -q "INV-2041" new-baseline.json; then echo "conversation text leaked into the baseline"; exit 1; fi

  scenario-fails:
    name: a scenario that fails is a failed step
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - id: tw
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: node -e "process.exit(3)"
          comment: false
      - env:
          OUTCOME: ${{ steps.tw.outcome }}
        run: '[ "$OUTCOME" = "failure" ] || { echo "a failing scenario must fail the step"; exit 1; }'

  pr-comment:
    name: keeps exactly one PR comment, updated in place; the token is not in the scenario's environment
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: build-tokenwire
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - name: count the action's comments before
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          mine='.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- tokenwire-diff -->"))) | .id'
          echo "n=$(gh api "$COMMENTS" --paginate --jq "$mine" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: env > "$RUNNER_TEMP/scenario.env" && node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
      - uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: VARIANT=tool node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
      - name: the token was not in the scenario's environment
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/scenario.env" ] || { echo "the scenario did not run"; exit 1; }
          if grep -qF "$TOKEN" "$RUNNER_TEMP/scenario.env"; then echo "the token reached the scenario"; exit 1; fi
          if grep -qE '^(GH_TOKEN|GITHUB_TOKEN|TW_TOKEN)=' "$RUNNER_TEMP/scenario.env"; then echo "a token variable reached the scenario"; exit 1; fi
      - name: no new comment once one exists, and the oldest is updated by the second run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
          BEFORE: ${{ steps.before.outputs.n }}
        run: |
          mine='.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- tokenwire-diff -->")))'
          n=$(gh api "$COMMENTS" --paginate --jq "$mine | .id" | wc -l | tr -d ' ')
          want=$(( BEFORE > 1 ? BEFORE : 1 ))
          echo "tokenwire comments on this PR: $BEFORE before, $n after"
          [ "$n" = "$want" ] || { echo "expected $want comment(s)"; exit 1; }
          oldest=$(gh api "$COMMENTS" --paginate --jq "$mine | .id" | sort -n | head -n1)
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/$oldest" --jq .body | grep -q "search_knowledge_base" \
            || { echo "the comment was not updated by the second run"; exit 1; }

  scenario-env:
    name: the token is not in the scenario's environment, and its leftover processes are killed
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: |
            env > "$RUNNER_TEMP/scenario.env"
            sleep 300 > /dev/null 2>&1 &
            echo $! > "$RUNNER_TEMP/leftover.pid"
            node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
          github-token: ${{ github.token }}
          comment: false
      - env:
          TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/scenario.env" ] || { echo "the scenario did not run"; exit 1; }
          if grep -qF "$TOKEN" "$RUNNER_TEMP/scenario.env"; then echo "the token reached the scenario"; exit 1; fi
          if grep -qE '^(GH_TOKEN|GITHUB_TOKEN|TW_TOKEN)=' "$RUNNER_TEMP/scenario.env"; then echo "a token variable reached the scenario"; exit 1; fi
          pid=$(cat "$RUNNER_TEMP/leftover.pid")
          # A killed process can linger as a zombie until it is reaped; that is not running.
          if [ -e "/proc/$pid" ] && ! grep -q '^State:[[:space:]]*Z' "/proc/$pid/status"; then
            echo "the scenario's background process $pid is still running"; exit 1
          fi

  baseline-symlink:
    name: a baseline replaced by a symlink is not a baseline
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - name: the change points the snapshot at a file it controls
        run: |
          echo '{}' > "$RUNNER_TEMP/elsewhere.json"
          ln -sf "$RUNNER_TEMP/elsewhere.json" test/fixture/tokenwire.snapshot.json
      - id: tw
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: VARIANT=tool node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
          comment: false
      - env:
          OUTCOME: ${{ steps.tw.outcome }}
          WRITTEN: ${{ steps.tw.outputs.baseline-written }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "expected failure, got $OUTCOME"; exit 1; }
          [ "$WRITTEN" != "true" ] || { echo "a new baseline was written"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/elsewhere.json")" = "{}" ] || { echo "a baseline was written through the symlink"; exit 1; }

  full-clone-stays-full:
    name: the base-branch fetch does not make a full clone shallow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: node test/fixture/scenario.mjs
          snapshot: new-baseline.json
          comment: false
      - run: |
          shallow=$(git rev-parse --is-shallow-repository)
          [ "$shallow" = "false" ] || { echo "the repository is shallow now"; exit 1; }

  baseline-deleted:
    name: deleting the baseline in a pull request fails instead of writing a new one
    # Needs a base branch that has the snapshot, which only a pull request event has.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-tokenwire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tokenwire-tgz, path: "${{ runner.temp }}/tokenwire" }
      - id: tgz
        run: echo "path=$(ls "$RUNNER_TEMP"/tokenwire/*.tgz)" >> "$GITHUB_OUTPUT"
      - name: the pull request deletes the snapshot
        run: rm test/fixture/tokenwire.snapshot.json
      - id: tw
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.tgz.outputs.path }}
          run: touch "$RUNNER_TEMP/scenario-ran" && VARIANT=tool node test/fixture/scenario.mjs
          snapshot: test/fixture/tokenwire.snapshot.json
          comment: false
      - env:
          OUTCOME: ${{ steps.tw.outcome }}
          WRITTEN: ${{ steps.tw.outputs.baseline-written }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "expected failure, got $OUTCOME"; exit 1; }
          [ "$WRITTEN" != "true" ] || { echo "a new baseline was written"; exit 1; }
          [ ! -e test/fixture/tokenwire.snapshot.json ] || { echo "a new baseline was written"; exit 1; }
          [ ! -e "$RUNNER_TEMP/scenario-ran" ] || { echo "the scenario ran before the check"; exit 1; }

  comment-filter:
    name: only the action's own comment is ever edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: a marker in someone else's comment is ignored
        env:
          TW_MARKER: "<!-- tokenwire-diff -->"
          TW_AUTHOR: "github-actions[bot]"
        run: |
          got=$(jq -r -f lib/find-comment.jq test/fixture/comments.json | tr '\n' ' ')
          echo "selected: $got"
          [ "$got" = "105 " ] || { echo "expected only comment 105 (github-actions[bot]'s own)"; exit 1; }
      - name: with comment-author set to an app, only the app's comment
        env:
          TW_MARKER: "<!-- tokenwire-diff -->"
          TW_AUTHOR: "my-app[bot]"
        run: |
          got=$(jq -r -f lib/find-comment.jq test/fixture/comments.json | tr '\n' ' ')
          [ "$got" = "104 " ] || { echo "expected only comment 104, got $got"; exit 1; }
      - name: identity unknown (GITHUB_TOKEN, app token), any bot's comment but never a person's
        env:
          TW_MARKER: "<!-- tokenwire-diff -->"
          TW_AUTHOR: ""
        run: |
          got=$(jq -r -f lib/find-comment.jq test/fixture/comments.json | tr '\n' ' ')
          [ "$got" = "104 105 " ] || { echo "expected 104 and 105, got $got"; exit 1; }
      - name: with a personal access token, that token's own comment is the one
        env:
          TW_MARKER: "<!-- tokenwire-diff -->"
          TW_AUTHOR: "someone-else"
        run: |
          got=$(jq -r -f lib/find-comment.jq test/fixture/comments.json | tr '\n' ' ')
          [ "$got" = "101 " ] || { echo "expected only comment 101, got $got"; exit 1; }
