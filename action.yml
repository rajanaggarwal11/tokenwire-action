name: "tokenwire"
description: "Size-limit for prompts: what each PR adds to every LLM request — tokens by section, tools, prompt-cache breaks to the character, cost. Records offline: no API key, nothing sent."
author: "Rajan Aggarwal"

branding:
  icon: "activity"
  color: "orange"

inputs:
  run:
    description: >-
      The command that runs your scenario — anything that makes the requests your app
      makes, e.g. `node test/agent-scenario.js` or `npm run llm-scenario`. Run with
      `bash -c`, so quoting and && work.
    required: true
  snapshot:
    description: >-
      Path of the committed baseline. If it does not exist yet, the step writes it,
      passes, and asks you to commit it.
    required: false
    default: "tokenwire.snapshot.json"
  max-increase:
    description: "Fail when input tokens per run grow by more than this: a percentage (`10%`) or a token count (`2k`). Empty: never fail on size."
    required: false
    default: ""
  fail-on-cache-break:
    description: "Fail when the change makes a request stop repeating the one before it, so the prompt cache misses."
    required: false
    default: "true"
  price:
    description: "USD per million input tokens, for a cost line in the report."
    required: false
    default: ""
  runs-per-day:
    description: "With `price`: how often the scenario runs in production, to show the change per day and month."
    required: false
    default: ""
  offline:
    description: "Answer the model locally instead of calling it: free, deterministic, no key. Set false to call the real provider (your scenario then needs an API key)."
    required: false
    default: "true"
  reply:
    description: "With offline: the assistant text every request gets back, if your app needs some to proceed."
    required: false
    default: ""
  comment:
    description: "On pull requests, post the report as a comment and keep updating that one comment. Needs `pull-requests: write`."
    required: false
    default: "true"
  github-token:
    description: "Token for the PR comment."
    required: false
    default: ${{ github.token }}
  version:
    description: >-
      Version of tokenwire to run. Defaults to the exact version this release of the action
      was tested with, so `@v1` always runs a known build. Set an exact version (`0.2.1`),
      an npm dist-tag (`latest`), or the path of a packed tarball to override.
    required: false
    default: "0.2.0"
  working-directory:
    description: "Directory to run in."
    required: false
    default: "."

outputs:
  input-tokens:
    description: "Input tokens per run, this change."
    value: ${{ steps.run.outputs.input-tokens }}
  base-input-tokens:
    description: "Input tokens per run in the baseline."
    value: ${{ steps.run.outputs.base-input-tokens }}
  delta-tokens:
    description: "Change in input tokens per run."
    value: ${{ steps.run.outputs.delta-tokens }}
  delta-pct:
    description: "Change in input tokens per run, in percent (empty if the baseline was empty)."
    value: ${{ steps.run.outputs.delta-pct }}
  cache-break:
    description: "`true` when this change introduces a prompt-cache break."
    value: ${{ steps.run.outputs.cache-break }}
  baseline-written:
    description: "`true` when there was no baseline and this run wrote one."
    value: ${{ steps.run.outputs.baseline-written }}
  report:
    description: "Path to the JSON report on the runner."
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    # 1. On a pull request with no baseline: was there one on the base branch? If so the PR
    #    deleted it, and writing a fresh one would make any change pass. This runs before
    #    anything from the PR does, and is the only step besides the comment that gets the
    #    token (for the fetch, through git's environment, never argv).
    - id: guard
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TW_SNAPSHOT: ${{ inputs.snapshot }}
        TW_BASE: ${{ github.base_ref }}
        TW_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -e "$TW_SNAPSHOT" ]; then
          exit 0
        fi
        if ! top=$(git rev-parse --show-toplevel 2>/dev/null); then
          echo "::error::tokenwire: $TW_SNAPSHOT is missing and this is not a git checkout, so the action cannot tell whether $TW_BASE has a baseline. Run actions/checkout before this action."
          exit 2
        fi
        case "$TW_SNAPSHOT" in
          "$top"/*) spec="${TW_SNAPSHOT#"$top"/}" ;;
          /*) exit 0 ;; # outside the repository, so it cannot be committed on the base branch either
          *) spec="./$TW_SNAPSHOT" ;; # git resolves ./ against the current directory
        esac

        if [ -n "$TW_TOKEN" ]; then
          basic=$(printf 'x-access-token:%s' "$TW_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          # An empty value first clears any header actions/checkout persisted.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0=""
          export GIT_CONFIG_KEY_1="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $basic"
        fi
        status=0
        git -c core.hooksPath=/dev/null fetch --quiet --no-tags --no-recurse-submodules --depth=1 \
          origin "+refs/heads/$TW_BASE:refs/remotes/origin/$TW_BASE" || status=$?
        if [ "$status" -ne 0 ]; then
          echo "::error::tokenwire: $TW_SNAPSHOT is missing, and the base branch $TW_BASE could not be fetched to check whether it has one. Commit the baseline, or make origin fetchable from this job."
          exit 2
        fi
        if git cat-file -e "refs/remotes/origin/$TW_BASE:$spec" 2>/dev/null; then
          echo "::error file=$TW_SNAPSHOT::tokenwire: $TW_SNAPSHOT exists on $TW_BASE but not in this pull request. Without it every change would pass, so this fails. Restore it with 'git checkout origin/$TW_BASE -- $TW_SNAPSHOT', or regenerate it locally and commit it if the change is intended."
          exit 1
        fi

    # 2. Record, compare, report. No token here: this step runs the scenario, which is
    #    code from the pull request, and the tokenwire package downloaded by npx.
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TW_RUN: ${{ inputs.run }}
        TW_SNAPSHOT: ${{ inputs.snapshot }}
        TW_MAX: ${{ inputs.max-increase }}
        TW_CACHE: ${{ inputs.fail-on-cache-break }}
        TW_PRICE: ${{ inputs.price }}
        TW_RUNS: ${{ inputs.runs-per-day }}
        TW_OFFLINE: ${{ inputs.offline }}
        TW_REPLY: ${{ inputs.reply }}
        TW_VERSION: ${{ inputs.version }}
      run: |
        # A composite `shell: bash` step runs as `bash -e -o pipefail`. Every command
        # whose exit code matters captures it on the same line, which -e leaves alone.

        if [ -z "${TW_RUN// }" ]; then
          echo "::error::tokenwire: the 'run' input is empty."
          exit 2
        fi
        # An exact package spec, so npx runs this package at this version and nothing else.
        case "$TW_VERSION" in
          *.tgz|file:*|/*|./*) pkg="${TW_VERSION#file:}" ;;
          *) pkg="tokenwire@${TW_VERSION}" ;;
        esac
        tw() { npx --yes --package "$pkg" tokenwire "$@"; }

        session="${RUNNER_TEMP}/tokenwire.session.jsonl"
        report="${RUNNER_TEMP}/tokenwire.diff.json"
        md="${RUNNER_TEMP}/tokenwire.diff.md"
        echo "report=$report" >> "$GITHUB_OUTPUT"

        # Record. --only budget with no budget runs no lint rules, so wrap's exit code is
        # the scenario's own: a failing scenario fails the step. The scenario does not get
        # the runner's env and path files, so it cannot plant variables for later steps.
        wrap=(wrap --session "$session" --only budget)
        if [ "$TW_OFFLINE" = "true" ]; then
          wrap+=(--offline)
          [ -n "$TW_REPLY" ] && wrap+=(--reply "$TW_REPLY")
        fi
        echo "::group::tokenwire · recording: $TW_RUN"
        status=0
        tw "${wrap[@]}" -- env -u GITHUB_ENV -u GITHUB_PATH bash -c "$TW_RUN" || status=$?
        echo "::endgroup::"
        if [ "$status" -ne 0 ]; then
          echo "::error::tokenwire: the scenario exited $status. See the log above."
          exit 2
        fi

        # No baseline (and, on a pull request, none on the base branch either): write it
        # and stop here.
        if [ ! -f "$TW_SNAPSHOT" ]; then
          status=0
          tw snapshot "$session" -o "$TW_SNAPSHOT" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::tokenwire: could not write the baseline. Did the scenario make any chat requests?"
            exit 2
          fi
          echo "baseline-written=true" >> "$GITHUB_OUTPUT"
          echo "::notice file=$TW_SNAPSHOT::tokenwire wrote the baseline $TW_SNAPSHOT on this runner. It is lost when the job ends: create it locally and commit it (see the README)."
          {
            echo "## tokenwire"
            echo
            echo "No baseline yet, so this run wrote \`$TW_SNAPSHOT\` on the runner, where it is thrown away. Create it locally and commit it: \`npx tokenwire wrap --offline -- <your command>\`, then \`npx tokenwire snapshot\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "baseline-written=false" >> "$GITHUB_OUTPUT"

        # Diff.
        args=(diff "$TW_SNAPSHOT" "$session")
        [ -n "$TW_MAX" ] && args+=(--max-increase "$TW_MAX")
        [ -n "$TW_PRICE" ] && args+=(--price "$TW_PRICE")
        [ -n "$TW_PRICE" ] && [ -n "$TW_RUNS" ] && args+=(--runs-per-day "$TW_RUNS")
        status=0
        tw "${args[@]}" --format json > "$report" || status=$?
        if [ "$status" -eq 2 ] || [ ! -s "$report" ]; then
          echo "::error::tokenwire could not compare against $TW_SNAPSHOT."
          tw "${args[@]}" || true
          exit 2
        fi
        tw "${args[@]}" --format markdown > "$md" || true
        tw "${args[@]}" || true
        cat "$md" >> "$GITHUB_STEP_SUMMARY"
        echo "markdown=$md" >> "$GITHUB_OUTPUT"

        node -e '
          const fs = require("fs");
          const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          const pct = d.delta.pct === null ? "" : Number(d.delta.pct).toFixed(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `input-tokens=${Number(d.head.inputTokens)}\nbase-input-tokens=${Number(d.base.inputTokens)}\n` +
            `delta-tokens=${Number(d.delta.tokens)}\ndelta-pct=${pct}\ncache-break=${d.cache.introduced.length > 0}\n`);
        ' "$report"

        # The CLI fails on a new cache break and on --max-increase; a cache break alone can
        # be waved through with fail-on-cache-break: false. The verdict is applied after
        # the comment, so a failing PR still gets its report.
        failed=false
        if [ "$status" -eq 1 ]; then
          only_cache=$(node -e '
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(d.failures.every((f) => f.startsWith("this change breaks prompt caching")));
          ' "$report")
          if [ "$TW_CACHE" != "true" ] && [ "$only_cache" = "true" ]; then
            echo "::warning::tokenwire: this change breaks prompt caching (fail-on-cache-break is off)."
          else
            failed=true
          fi
        fi
        echo "failed=$failed" >> "$GITHUB_OUTPUT"

    # 3. One comment per PR, updated in place. Only a comment this action's own identity
    #    posted is ever edited, so a marker pasted into someone else's comment is ignored.
    - id: comment
      if: inputs.comment == 'true' && github.event.pull_request.number && steps.run.outputs.markdown != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TW_PR: ${{ github.event.pull_request.number }}
        TW_REPO: ${{ github.repository }}
        TW_MD: ${{ steps.run.outputs.markdown }}
        TW_MARKER: "<!-- tokenwire-diff -->"
      run: |
        # A personal access token can say who it is; GITHUB_TOKEN cannot (403), and posts
        # as github-actions[bot].
        # On an error gh prints the response body to stdout, so only a zero exit counts.
        if login=$(gh api user --jq .login 2>/dev/null) && [ -n "$login" ] && [ "$login" != "null" ]; then
          TW_AUTHOR="$login"
        else
          TW_AUTHOR="github-actions[bot]"
        fi
        export TW_AUTHOR
        filter=$(cat "$GITHUB_ACTION_PATH/lib/find-comment.jq")
        existing=""
        if ids=$(gh api "repos/$TW_REPO/issues/$TW_PR/comments" --paginate --jq "$filter" 2>/dev/null); then
          existing=$(printf '%s\n' "$ids" | head -n1)
        fi
        case "$existing" in *[!0-9]*) existing="" ;; esac
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$TW_REPO/issues/comments/$existing" -F "body=@$TW_MD" >/dev/null \
            || echo "::warning::tokenwire could not update the PR comment (does the job have pull-requests: write?)"
        else
          gh api -X POST "repos/$TW_REPO/issues/$TW_PR/comments" -F "body=@$TW_MD" >/dev/null \
            || echo "::warning::tokenwire could not comment on the PR. Pull requests from forks get a read-only token; the report is in the job summary."
        fi

    # 4. Verdict.
    - if: steps.run.outputs.failed == 'true'
      shell: bash
      env:
        TW_REPORT: ${{ steps.run.outputs.report }}
      run: |
        node -e '
          const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
          for (const f of d.failures) console.log(`::error::tokenwire: ${String(f).replace(/[\r\n]+/g, " ")}`);
        ' "$TW_REPORT"
        exit 1
